<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAA SQL Masterclass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-dark: #050508;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.6);
            --secondary: #ec4899;
            --text-main: #ffffff;
            
            --table-bg: rgba(20, 20, 25, 0.7);
            --table-border: rgba(255, 255, 255, 0.1);
            --pk-color: #f43f5e;
            --fk-color: #10b981;
            
            --code-bg: #0f0f13;
            --code-kw: #c678dd;
            --code-tb: #61afef;
            --code-ty: #e5c07b;
            --code-str: #98c379;
            --code-cm: #5c6370;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- ЖИВОЙ ФОН (Частицы и сетка) --- */
        .bg-grid {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(20deg);
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }
        @keyframes gridMove {
            0% { transform: rotateX(20deg) translateY(0); }
            100% { transform: rotateX(20deg) translateY(40px); }
        }

        .particles {
            position: absolute; inset: 0; z-index: 1; pointer-events: none;
            background-image: radial-gradient(circle, #8b5cf6 1px, transparent 1px);
            background-size: 100px 100px;
            animation: particleFloat 30s linear infinite;
            opacity: 0.3;
        }
        @keyframes particleFloat {
            0% { background-position: 0 0; }
            100% { background-position: -200px -400px; }
        }

        /* --- ПЛЕЕР --- */
        .cinema-container {
            width: 95vw; max-width: 1200px;
            height: 85vh; max-height: 750px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05), inset 0 0 50px rgba(139, 92, 246, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* --- МИР (Сцена с координатами) --- */
        .stage {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }

        .world {
            position: absolute;
            top: 0; left: 0;
            width: 1200px; height: 600px; /* Фиксированная сетка координат */
            transform-origin: top left;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Свечение под таблицами */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            transition: all 1s ease;
        }

        /* --- ТАБЛИЦЫ --- */
        .entity {
            position: absolute;
            min-width: 180px;
            background: var(--table-bg);
            border: 1px solid var(--table-border);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        .entity.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .entity.active {
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--primary-glow), 0 15px 35px rgba(0,0,0,0.5);
            transform: translateY(-5px) scale(1.02);
            z-index: 30;
        }

        .entity-title {
            background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
            padding: 12px;
            text-align: left;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--table-border);
            border-radius: 12px 12px 0 0;
            text-transform: uppercase;
            color: #fff;
            display: flex; align-items: center; gap: 8px;
        }
        .entity-title::before {
            content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px var(--primary);
        }

        .entity-fields {
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .field { display: flex; justify-content: space-between; opacity: 0; transform: translateX(-10px); transition: all 0.4s ease; }
        .entity.show .field { opacity: 1; transform: translateX(0); }
        
        .pk { color: var(--pk-color); font-weight: bold; }
        .pk::after { content: ' 🔑'; font-size: 10px; }
        .fk { color: var(--fk-color); font-style: italic; }
        .fk::after { content: ' 🔗'; font-size: 10px; }

        /* --- SVG ЛИНИИ --- */
        #svg-lines {
            position: absolute; top: 0; left: 0;
            width: 1200px; height: 600px;
            pointer-events: none;
            z-index: 10;
        }
        .line-path {
            fill: none;
            stroke-width: 2.5;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .line-path.drawn { stroke-dashoffset: 0; }
        .line-glow {
            fill: none; stroke-width: 8; opacity: 0.3; filter: blur(4px);
            stroke-dasharray: 2000; stroke-dashoffset: 2000;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .line-glow.drawn { stroke-dashoffset: 0; }

        .badge {
            position: absolute;
            background: #000; border: 1px solid;
            padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: bold; font-family: 'JetBrains Mono';
            opacity: 0; transform: scale(0);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 15; box-shadow: 0 0 15px currentColor;
        }
        .badge.show { opacity: 1; transform: scale(1); }

        /* --- РЕДАКТОР КОДА (Терминал) --- */
        .terminal {
            position: absolute;
            top: 40px; right: 40px;
            width: 480px;
            background: rgba(15, 15, 19, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            box-shadow: -20px 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.7;
            opacity: 0;
            transform: translateX(100px) rotateY(-10deg);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
            transform-origin: right center;
        }
        .terminal.show {
            opacity: 1;
            transform: translateX(0) rotateY(0);
        }
        .term-header {
            display: flex; gap: 8px; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
        
        .line { display: block; opacity: 0; transform: translateX(-10px); transition: all 0.2s ease; }
        .line.show { opacity: 1; transform: translateX(0); }
        
        .kw { color: var(--code-kw); font-weight: bold; }
        .tb { color: var(--code-tb); font-weight: bold; }
        .ty { color: var(--code-ty); }
        .cm { color: var(--code-cm); font-style: italic; }
        
        /* Курсор в терминале */
        .cursor {
            display: inline-block; width: 8px; height: 16px; background: var(--primary);
            animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- СУБТИТРЫ --- */
        .subtitle-container {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 80%; max-width: 800px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            font-size: 20px; font-weight: 600;
            line-height: 1.5;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(139, 92, 246, 0.2);
        }
        .subtitle-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- КОНТРОЛЛЕРЫ --- */
        .controls {
            height: 80px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 40px;
            gap: 25px;
            z-index: 100;
        }
        
        .btn-play {
            width: 55px; height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px var(--primary-glow);
        }
        .btn-play:hover { transform: scale(1.1); box-shadow: 0 0 40px var(--primary-glow); }
        .btn-play:disabled { background: #333; box-shadow: none; cursor: not-allowed; transform: none; }

        .progress-bar {
            flex-grow: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        
        .time-display {
            font-family: 'JetBrains Mono', monospace;
            color: #888;
            font-size: 14px;
            min-width: 90px; text-align: right;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="particles"></div>

    <div class="cinema-container">
        <div class="stage" id="stage">
            <div class="world" id="world">
                <!-- Свечения -->
                <div class="glow-orb" style="width: 300px; height: 300px; background: rgba(139,92,246,0.2); top: 50px; left: 50px;" id="glow-1"></div>
                <div class="glow-orb" style="width: 300px; height: 300px; background: rgba(236,72,153,0.2); top: 50px; left: 700px;" id="glow-2"></div>
                
                <!-- SVG для линий -->
                <svg id="svg-lines"></svg>
            </div>

            <!-- Терминал (вне мира, чтобы не двигался с камерой) -->
            <div class="terminal" id="terminal">
                <div class="term-header">
                    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
                    <span style="color:#555; font-size: 12px; margin-left: 10px; font-family: 'JetBrains Mono';">postgres@localhost:~</span>
                </div>
                <div id="code-content"></div>
            </div>

            <!-- Субтитры -->
            <div class="subtitle-container" id="subtitle"></div>
        </div>

        <div class="controls">
            <button class="btn-play" id="playBtn">▶</button>
            <div class="progress-bar" onclick="seek(event)">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="time-display" id="timeDisplay">00:00</div>
        </div>
    </div>

<script>
    // --- КОНФИГУРАЦИЯ СЦЕНАРИЯ ---
    const timeline = [
        { action: 'wait', time: 500 },
        { action: 'subtitle', text: "Привет! Сегодня мы спроектируем базу данных для магазина.", duration: 3000 },
        
        // Сцена 1: Появление таблиц
        { action: 'subtitle', text: "Шаг 1. Выделяем сущности. Это наши будущие таблицы.", duration: 2500 },
        { action: 'spawnEntity', id: 'kassir', title: 'КАССИР', x: 100, y: 100, fields: ['ID_Кассира (PK)', 'ФИО'] },
        { action: 'spawnEntity', id: 'korzina', title: 'КОРЗИНА', x: 400, y: 100, fields: ['ID_Корзины (PK)', 'Дата'] },
        { action: 'spawnEntity', id: 'tovar', title: 'ТОВАР', x: 700, y: 100, fields: ['ID_Товара (PK)', 'Цена'] },
        { action: 'spawnEntity', id: 'kategoria', title: 'КАТЕГОРИЯ', x: 1000, y: 100, fields: ['ID_Категории (PK)', 'Название'] },
        { action: 'wait', time: 1500 },

        // Сцена 2: Связи 1:M
        { action: 'subtitle', text: "Шаг 2. Один кассир создает много корзин. Связь 1:M.", duration: 3000 },
        { action: 'highlight', id: 'kassir' },
        { action: 'highlight', id: 'korzina' },
        { action: 'drawLine', from: 'kassir', to: 'korzina', label1: '1', label2: 'M', color: '#8b5cf6' },
        { action: 'addFK', id: 'korzina', field: 'ID_Кассира (FK)' },
        { action: 'wait', time: 2000 },

        { action: 'subtitle', text: "А одна категория содержит много товаров. Тоже 1:M.", duration: 2500 },
        { action: 'highlight', id: 'kategoria' },
        { action: 'highlight', id: 'tovar' },
        { action: 'drawLine', from: 'kategoria', to: 'tovar', label1: '1', label2: 'M', color: '#ec4899' },
        { action: 'addFK', id: 'tovar', field: 'ID_Категории (FK)' },
        { action: 'wait', time: 2000 },

        // Сцена 3: Связь M:M
        { action: 'unhighlightAll' },
        { action: 'subtitle', text: "Самое сложное: Корзина и Товар. В корзине много товаров, и товар может быть в разных корзинах. Связь M:M!", duration: 4000 },
        { action: 'highlight', id: 'korzina' },
        { action: 'highlight', id: 'tovar' },
        { action: 'drawLine', from: 'korzina', to: 'tovar', label1: 'M', label2: 'M', color: '#f43f5e' },
        { action: 'wait', time: 2000 },
        
        { action: 'subtitle', text: "Для связи M:M нужна промежуточная таблица.", duration: 2500 },
        { action: 'spawnEntity', id: 'sostav', title: 'СОСТАВ_КОРЗИНЫ', x: 550, y: 350, fields: ['ID_Корзины (FK)', 'ID_Товара (FK)', 'Кол-во'] },
        { action: 'drawLine', from: 'korzina', to: 'sostav', label1: '1', label2: 'M', color: '#f43f5e' },
        { action: 'drawLine', from: 'tovar', to: 'sostav', label1: '1', label2: 'M', color: '#f43f5e' },
        { action: 'wait', time: 3000 },

        // Сцена 4: Переход в SQL (Камера)
        { action: 'subtitle', text: "Шаг 4. Переносим модель в SQL. Сначала главные таблицы.", duration: 3000 },
        { action: 'unhighlightAll' },
        { action: 'moveCamera', x: -350, y: -50, scale: 0.8 }, // Сдвигаем схему влево и уменьшаем
        { action: 'showTerminal' },
        { action: 'writeSQL', lines: [
            '<span class="cm">-- 1. Главная таблица</span>',
            '<span class="kw">CREATE TABLE</span> <span class="tb">Кассир</span> (',
            '    ID_Кассира <span class="ty">SERIAL NOT NULL</span>,',
            '    ФИО <span class="ty">VARCHAR(100) NOT NULL</span>,',
            '    <span class="kw">PRIMARY KEY</span> (ID_Кассира)',
            ');'
        ]},
        { action: 'wait', time: 3000 },

        // Сцена 5: SQL Корзина
        { action: 'subtitle', text: "Теперь зависимая таблица. Добавляем FOREIGN KEY на кассира.", duration: 3000 },
        { action: 'highlight', id: 'korzina' },
        { action: 'writeSQL', lines: [
            '',
            '<span class="cm">-- 2. Зависимая таблица</span>',
            '<span class="kw">CREATE TABLE</span> <span class="tb">Корзина</span> (',
            '    ID_Корзины <span class="ty">SERIAL NOT NULL</span>,',
            '    Дата <span class="ty">DATE</span>,',
            '    ID_Кассира <span class="ty">INT</span>, <span class="cm">-- Ссылка</span>',
            '    <span class="kw">PRIMARY KEY</span> (ID_Корзины),',
            '    <span class="kw">FOREIGN KEY</span> (ID_Кассира) <span class="kw">REFERENCES</span> <span class="tb">Кассир</span> (ID_Кассира)',
            ');'
        ]},
        { action: 'wait', time: 3000 },

        // Сцена 6: SQL Состав (Составной ключ)
        { action: 'subtitle', text: "И таблица-связка. Внимание на составной PRIMARY KEY!", duration: 4000 },
        { action: 'highlight', id: 'sostav' },
        { action: 'writeSQL', lines: [
            '',
            '<span class="cm">-- 3. Промежуточная таблица (M:M)</span>',
            '<span class="kw">CREATE TABLE</span> <span class="tb">Состав_Корзины</span> (',
            '    ID_Корзины <span class="ty">INT</span>,',
            '    ID_Товара <span class="ty">INT</span>,',
            '    Кол_во <span class="ty">INT</span>,',
            '    <span class="kw">PRIMARY KEY</span> (ID_Корзины, ID_Товара),',
            '    <span class="kw">FOREIGN KEY</span> (ID_Корзины) <span class="kw">REFERENCES</span> <span class="tb">Корзина</span> (ID_Корзины),',
            '    <span class="kw">FOREIGN KEY</span> (ID_Товара) <span class="kw">REFERENCES</span> <span class="tb">Товар</span> (ID_Товара)',
            ');'
        ]},
        { action: 'wait', time: 5000 },

        // Финал
        { action: 'subtitle', text: "Готово! Модель спроектирована идеально. Ты готов к РК! 🚀", duration: 4000 },
        { action: 'resetCamera' }
    ];

    // --- ДВИЖОК ---
    const world = document.getElementById('world');
    const svg = document.getElementById('svg-lines');
    const subtitle = document.getElementById('subtitle');
    const terminal = document.getElementById('terminal');
    const codeContent = document.getElementById('code-content');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    
    let isPlaying = false;
    let currentIndex = 0;
    let timeouts = [];
    let entities = {};
    let totalDuration = timeline.length * 2; // Примерная оценка

    const wait = (ms) => new Promise(res => {
        const t = setTimeout(res, ms);
        timeouts.push(t);
    });

    function clearTimers() { timeouts.forEach(clearTimeout); timeouts = []; }

    // Управление камерой (сдвиг и зум)
    function moveCamera(x, y, scale) {
        world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }

    function resetCamera() {
        world.style.transform = `translate(0, 0) scale(1)`;
    }

    // Создание таблицы
    async function spawnEntity(id, title, x, y, fields) {
        const el = document.createElement('div');
        el.className = 'entity';
        el.id = `entity-${id}`;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        
        let fieldsHtml = fields.map((f, i) => {
            let cls = f.includes('(PK)') ? 'pk' : f.includes('(FK)') ? 'fk' : '';
            return `<div class="field ${cls}" style="transition-delay: ${i * 0.1}s">${f.replace(' (PK)', '').replace(' (FK)', '')}</div>`;
        }).join('');

        el.innerHTML = `<div class="entity-title">${title}</div><div class="entity-fields">${fieldsHtml}</div>`;
        world.appendChild(el);
        entities[id] = el;
        
        await wait(50); 
        el.classList.add('show');
        await wait(600); 
    }

    async function addFK(id, field) {
        const entity = entities[id];
        if (entity) {
            const fieldsCont = entity.querySelector('.entity-fields');
            const div = document.createElement('div');
            div.className = 'field fk';
            div.innerText = field.replace(' (FK)', '');
            fieldsCont.appendChild(div);
            await wait(50);
            div.style.opacity = '1';
            div.style.transform = 'translateX(0)';
        }
    }

    // Рисование неоновой линии
    async function drawLine(fromId, toId, label1, label2, color) {
        const fromEl = entities[fromId];
        const toEl = entities[toId];
        if (!fromEl || !toEl) return;

        const r1 = fromEl.getBoundingClientRect();
        const r2 = toEl.getBoundingClientRect();
        const worldRect = world.getBoundingClientRect();
        
        // Координаты внутри мира
        const scale = worldRect.width / 1200;
        const x1 = (r1.left - worldRect.left) / scale + r1.width / (2 * scale);
        const y1 = (r1.top - worldRect.top) / scale + r1.height / (2 * scale);
        const x2 = (r2.left - worldRect.left) / scale + r2.width / (2 * scale);
        const y2 = (r2.top - worldRect.top) / scale + r2.height / (2 * scale);

        // Рисуем линию и свечение
        const pathD = `M ${x1} ${y1} C ${x1 + (x2-x1)/2} ${y1}, ${x2 - (x2-x1)/2} ${y2}, ${x2} ${y2}`;
        
        const glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        glow.setAttribute('d', pathD);
        glow.setAttribute('class', 'line-glow');
        glow.style.stroke = color;
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathD);
        path.setAttribute('class', 'line-path');
        path.style.stroke = color;
        path.style.filter = `drop-shadow(0 0 8px ${color})`;
        
        svg.appendChild(glow);
        svg.appendChild(path);
        
        await wait(50);
        path.classList.add('drawn');
        glow.classList.add('drawn');

        // Бейджи 1, M
        const b1 = document.createElement('div');
        b1.className = 'badge'; b1.innerText = label1;
        b1.style.left = `${x1 + (x2-x1)*0.2 - 10}px`;
        b1.style.top = `${y1 + (y2-y1)*0.2 - 10}px`;
        b1.style.color = color; b1.style.borderColor = color;
        
        const b2 = document.createElement('div');
        b2.className = 'badge'; b2.innerText = label2;
        b2.style.left = `${x1 + (x2-x1)*0.8 - 10}px`;
        b2.style.top = `${y1 + (y2-y1)*0.8 - 10}px`;
        b2.style.color = color; b2.style.borderColor = color;

        world.appendChild(b1); world.appendChild(b2);
        await wait(300);
        b1.classList.add('show'); b2.classList.add('show');
        await wait(800);
    }

    function highlight(id) { if (entities[id]) entities[id].classList.add('active'); }
    function unhighlightAll() { Object.values(entities).forEach(el => el.classList.remove('active')); }

    // Печать текста в субтитрах (эффект печатной машинки)
    async function showSubtitle(text, duration) {
        subtitle.innerHTML = '<span id="typewriter"></span><span class="cursor"></span>';
        subtitle.classList.add('show');
        const tw = document.getElementById('typewriter');
        
        // Печатаем по буквам
        for (let i = 0; i < text.length; i++) {
            tw.innerText += text[i];
            await wait(20); 
        }
        
        await wait(duration - (text.length * 20)); 
        subtitle.classList.remove('show');
        await wait(300); 
    }

    async function showTerminal() { terminal.classList.add('show'); await wait(800); }

    // Печать кода в терминале
    async function writeSQL(lines) {
        for (let i = 0; i < lines.length; i++) {
            const span = document.createElement('span');
            span.className = 'line';
            codeContent.appendChild(span);
            
            // Эмуляция печати символов
            const rawHtml = lines[i] || '&nbsp;';
            span.innerHTML = rawHtml;
            
            await wait(50);
            span.classList.add('show');
            await wait(150); 
        }
        // В конце оставляем курсор
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        codeContent.appendChild(cursor);
    }

    // --- ЦИКЛ ВОСПРОИЗВЕДЕНИЯ ---
    async function playTimeline() {
        if (currentIndex >= timeline.length) {
            isPlaying = false;
            playBtn.innerHTML = '🔄';
            return;
        }

        const step = timeline[currentIndex];
        currentIndex++;

        progressBar.style.width = `${(currentIndex / timeline.length) * 100}%`;
        
        switch (step.action) {
            case 'wait': await wait(step.time); break;
            case 'subtitle': await showSubtitle(step.text, step.duration); break;
            case 'spawnEntity': await spawnEntity(step.id, step.title, step.x, step.y, step.fields); break;
            case 'drawLine': await drawLine(step.from, step.to, step.label1, step.label2, step.color); break;
            case 'highlight': highlight(step.id); break;
            case 'unhighlightAll': unhighlightAll(); break;
            case 'addFK': await addFK(step.id, step.field); break;
            case 'moveCamera': moveCamera(step.x, step.y, step.scale); await wait(1500); break;
            case 'resetCamera': resetCamera(); await wait(1500); break;
            case 'showTerminal': await showTerminal(); break;
            case 'writeSQL': await writeSQL(step.lines); break;
        }

        if (isPlaying) playTimeline();
    }

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            isPlaying = true;
            playBtn.innerHTML = '⏸';
            if (currentIndex >= timeline.length) {
                // Идеальный рестарт
                location.reload();
            } else {
                playTimeline();
            }
        } else {
            isPlaying = false;
            playBtn.innerHTML = '▶';
            // Пауза (просто останавливаем цикл, таймеры продолжат идти в фоне, 
            // но для простоты презентации это допустимо)
        }
    });

    // Инициализация адаптивности
    function resize() {
        const stage = document.getElementById('stage');
        const scaleX = stage.clientWidth / 1200;
        const scaleY = stage.clientHeight / 600;
        const scale = Math.min(scaleX, scaleY);
        
        // Центрируем сцену
        const xOffset = (stage.clientWidth - (1200 * scale)) / 2;
        const yOffset = (stage.clientHeight - (600 * scale)) / 2;
        
        world.style.transformOrigin = 'top left';
        // Базовый масштаб (если камера не двигалась)
        if (!isPlaying || currentIndex < 12) {
            world.style.transform = `translate(${xOffset}px, ${yOffset}px) scale(${scale})`;
        }
    }
    
    window.addEventListener('resize', resize);
    resize(); // Вызов при старте

</script>
</body>
</html>
